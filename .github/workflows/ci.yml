name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi==0.111.0 \
            httpx==0.27.0 \
            python-dotenv==1.0.1 \
            pydantic==2.7.4 \
            python-multipart==0.0.9 \
            "numpy>=1.23,<3" \
            pytest==8.3.5

      - name: Run backend unit tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Validate production artifacts
        run: python scripts/verify_production.py --allow-missing-env

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate n8n workflow and frontend JavaScript
        run: |
          node n8n/generate_workflow4_outbound.mjs
          git diff --exit-code -- "n8n/Workflow 4_ Sharon Bakery Outbound Worker.json"
          node n8n/test_workflow4_outbound.mjs
          node --check n8n/generate_workflow4_outbound.mjs
          node --check backend/frontend/assets/app.js
