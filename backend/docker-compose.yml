services:
  fastapi:
    build: .
    container_name: inventory-inspection-ai-fastapi
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}

    volumes:
      - ./models:/app/models
      - ./app:/app/app
